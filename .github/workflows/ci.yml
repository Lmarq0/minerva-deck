name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive13 libegl1 libgl1 libxkbcommon-x11-0
      - name: Install Python dependencies
        run: python -m pip install -e .
      - name: Validate imports
        run: python -c "import libarchive, libtorrent, PySide6"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript tests
        run: |
          node --check public/static/app.js
          node --check public/static/controller.js
          node --test tests/controller_navigation.test.mjs tests/app_search.test.mjs
      - name: Packaged entry self-test prerequisites
        env:
          QT_QPA_PLATFORM: offscreen
        run: python minerva_deck.py --self-test
