name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build portable EXE
        shell: powershell
        run: .\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  deck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream build-essential cmake curl git ninja-build patchelf pkg-config \
            libasound2 libegl1 libgl1 libnspr4 libnss3 libx11-xcb1 \
            libxcomposite1 libxdamage1 libxkbcommon-x11-0 libxkbfile1 \
            libxrandr2 libxtst6 \
            zip unzip zlib1g-dev
      - name: Build Steam Deck AppImage
        run: |
          chmod +x build-deck.sh packaging/AppRun
          ./build-deck.sh
      - uses: actions/upload-artifact@v4
        with:
          name: steamdeck-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, deck]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.exe *.AppImage > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes

      # Code signing is intentionally deferred. Add a signing job before
      # artifact upload when repository certificate secrets are available.
