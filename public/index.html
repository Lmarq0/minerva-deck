<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="minerva-session-token" content="__MINERVA_SESSION_TOKEN__" />
    <title>MiNERVA Deck</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <span class="wordmark">MiNERVA <span>Deck</span></span>
        <label class="search" for="query">
          <span class="sr-only">Search games</span>
          <input id="query" type="search" autocomplete="off" spellcheck="false" placeholder="Search games" />
          <button id="clearQueryButton" class="search-clear" type="button" aria-label="Clear search" hidden>×</button>
        </label>
        <button id="settingsButton" class="button" type="button">Settings</button>
        <button id="downloadsButton" class="button" type="button" aria-controls="downloadsDialog" aria-expanded="false">
          Downloads <span id="queueBadge" class="badge" hidden>0</span>
        </button>
      </header>

      <div id="setupBanner" class="banner" role="alert" hidden>
        <span id="setupBannerText"></span>
        <button id="dismissSetupButton" class="button small" type="button">Dismiss</button>
      </div>

      <main class="main">
        <section class="results-pane" aria-label="Search results">
          <div class="results-head">
            <div id="systemChips" class="chips" role="tablist" aria-label="Filter by system"></div>
            <span id="searchCount" class="muted">Ready</span>
          </div>
          <div id="results" class="results" aria-live="polite" aria-busy="false"></div>
        </section>

        <section id="detail" class="detail" aria-label="Selected game">
          <div id="detailEmpty" class="detail-empty">
            <p>Pick a game to see its versions and where it will be saved.</p>
          </div>

          <article id="detailCard" class="detail-card" hidden>
            <div class="detail-top">
              <div id="detailCover" class="cover large"></div>
              <div class="detail-info">
                <h1 id="detailTitle"></h1>
                <p id="detailSystem" class="muted"></p>
                <p><span id="detailSource" class="source"></span></p>
              </div>
            </div>

            <h2 class="section-title">Version</h2>
            <div id="variantList" class="variants" role="radiogroup" aria-label="Version"></div>

            <div class="destination">
              <div>
                <span class="muted">Saves to</span>
                <strong id="destinationSummary"></strong>
              </div>
              <button id="browseSubfolderButton" class="button small" type="button">Change</button>
            </div>
            <p id="destinationHint" class="hint" hidden></p>

            <label id="legalRow" class="check" hidden>
              <input id="legalConfirm" type="checkbox" />
              <span>I have the right to download and use files I get with MiNERVA Deck.</span>
            </label>

            <button id="downloadButton" class="button primary wide" type="button" disabled>Download</button>
            <p id="downloadHelp" class="hint"></p>
          </article>
        </section>
      </main>

      <section id="tray" class="tray" aria-label="Current download" hidden>
        <div class="tray-info">
          <strong id="trayName"></strong>
          <span id="trayStatus" class="muted"></span>
        </div>
        <div class="progress" role="progressbar" aria-label="Download progress" aria-valuemin="0" aria-valuemax="100">
          <span id="trayProgress"></span>
        </div>
        <button id="trayCancelButton" class="button small" type="button">Cancel</button>
        <button id="trayOpenButton" class="button small" type="button">All downloads</button>
      </section>

      <footer class="hints" aria-hidden="true">
        <span><kbd>A</kbd> <span id="hintAccept">Select</span></span>
        <span><kbd>B</kbd> Back</span>
        <span><kbd>Y</kbd> Search</span>
        <span><kbd>L1</kbd><kbd>R1</kbd> System</span>
      </footer>
    </div>

    <section id="settingsDialog" class="overlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
      <div class="panel">
        <div class="panel-head">
          <h2 id="settingsTitle">Settings</h2>
          <button id="settingsCloseButton" class="button small" type="button">Done</button>
        </div>
        <label class="field-label" for="destination">EmuDeck ROMs folder</label>
        <div class="path-row">
          <input id="destination" type="text" spellcheck="false" />
          <button id="browseRootButton" class="button" type="button">Browse</button>
          <button id="defaultDirButton" class="button" type="button">Reset</button>
        </div>
        <p class="hint">Games go into the matching system folder inside it, such as roms/snes.</p>
        <label class="check">
          <input id="extractToggle" type="checkbox" checked />
          <span>Extract archives after downloading</span>
        </label>
        <label class="check">
          <input id="rootFallbackToggle" type="checkbox" />
          <span>Save unrecognized systems in the ROMs folder itself</span>
        </label>
        <label class="check">
          <input id="allFilesToggle" type="checkbox" />
          <span>Show non-game files (scans, manuals, music)</span>
        </label>
        <p id="catalogInfo" class="hint"></p>
      </div>
    </section>

    <section id="downloadsDialog" class="overlay" role="dialog" aria-modal="true" aria-labelledby="downloadsTitle" hidden>
      <div class="panel wide">
        <div class="panel-head">
          <h2 id="downloadsTitle">Downloads</h2>
          <div class="download-filters" role="tablist" aria-label="Filter downloads">
            <button class="chip active" type="button" role="tab" data-download-filter="all" aria-selected="true">All</button>
            <button class="chip" type="button" role="tab" data-download-filter="active" aria-selected="false">Active <span id="downloadsActiveCount">0</span></button>
            <button class="chip" type="button" role="tab" data-download-filter="done" aria-selected="false">Completed <span id="downloadsCompletedCount">0</span></button>
            <button class="chip" type="button" role="tab" data-download-filter="issues" aria-selected="false">Failed <span id="downloadsIssueCount">0</span></button>
          </div>
          <button id="downloadsCloseButton" class="button small" type="button">Close</button>
        </div>
        <div class="downloads-layout">
          <div id="downloadsList" class="download-list" aria-live="polite"></div>
          <article id="downloadsDetail" class="download-detail" aria-live="polite"></article>
        </div>
      </div>
    </section>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
